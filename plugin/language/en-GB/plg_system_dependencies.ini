PLG_SYSTEM_DEPENDENCIES="System - Dependencies"
PLG_SYSTEM_DEPENDENCIES_XML_DESCRIPTION="Prototype: lets extensions declare &lt;dependencies&gt; in their manifest. Refuses installs whose dependencies are not met, and keeps extensions that others still need from being uninstalled."

PLG_SYSTEM_DEPENDENCIES_REFUSED="%s was not installed, because its dependencies are not met:"
PLG_SYSTEM_DEPENDENCIES_PROBLEM_MISSING="%1$s needs %2$s, which is not installed."
PLG_SYSTEM_DEPENDENCIES_PROBLEM_WRONG_VERSION="%1$s needs %2$s, but version %3$s is installed."
PLG_SYSTEM_DEPENDENCIES_PROBLEM_UNREADABLE="%1$s needs %2$s, and version &quot;%3$s&quot; cannot be compared with that."
PLG_SYSTEM_DEPENDENCIES_PROBLEM_DOWNGRADE="This would replace %1$s %2$s with the older version %3$s, and other extensions depend on it."
PLG_SYSTEM_DEPENDENCIES_PROBLEM_BREAKS_DEPENDENT="%1$s needs %2$s, and this would install version %3$s."
PLG_SYSTEM_DEPENDENCIES_UNMET_AFTER="Installed, but a dependency is not met: %s"
PLG_SYSTEM_DEPENDENCIES_KEPT="%1$s was not uninstalled, because other extensions still need it: %2$s."
PLG_SYSTEM_DEPENDENCIES_MANIFEST_WARNING="%1$s: %2$s"
PLG_SYSTEM_DEPENDENCIES_INSTALLED="Dependencies: read the manifests of all installed extensions and locked %d extensions that others need."
